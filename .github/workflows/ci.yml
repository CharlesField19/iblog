name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: docker build --pull=false -t iblog:ci .
      - name: Docker end-to-end and backup/restore check
        run: node scripts/e2e-docker.mjs iblog:ci
