services:
  blog:
    image: ghcr.io/charlesfield19/iblog:latest
    container_name: iblog
    restart: unless-stopped
    ports:
      # Expose only through a local HTTPS reverse proxy by default.
      - "127.0.0.1:11190:11190"
    volumes:
      - blog_data:/data
    environment:
      BLOG_ADDR: ":11190"
      BLOG_DB_PATH: /data/blog.db
      BLOG_WEB_DIST: /app/static/web
      BLOG_ADMIN_DIST: /app/static/admin
      # 仅本机 HTTP 预览可设为 false；生产部署必须使用 HTTPS。
      BLOG_COOKIE_SECURE: "true"
      # Public origin used to validate browser write requests; override for production HTTPS.
      BLOG_PUBLIC_ORIGIN: ${BLOG_PUBLIC_ORIGIN:-http://127.0.0.1:11190}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11190/api/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s

volumes:
  blog_data:
    name: iblog_data
